[project]
name = "sdp-common"
version = "0.1.0"
description = "Contracts, packet envelope and service clients shared by every Solution Discovery Platform service. Services depend on this, never on each other."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "fastapi>=0.110",
]

[project.optional-dependencies]
pubsub = ["google-cloud-pubsub>=2.21"]
iap = ["google-auth>=2.28", "requests>=2.31"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sdp_common"]
