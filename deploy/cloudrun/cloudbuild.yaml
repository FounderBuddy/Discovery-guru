# Builds all 12 images in parallel. Invoked by deploy.sh with _REPO and _TAG.
steps:
  - { id: ledger,                name: gcr.io/cloud-builders/docker, waitFor: ["-"], args: [build, -f, deploy/Dockerfile.service, --build-arg, SERVICE=ledger,                -t, "${_REPO}/ledger:${_TAG}", .] }
  - { id: event-bus,             name: gcr.io/cloud-builders/docker, waitFor: ["-"], args: [build, -f, deploy/Dockerfile.service, --build-arg, SERVICE=event-bus,             -t, "${_REPO}/event-bus:${_TAG}", .] }
  - { id: model-gateway,         name: gcr.io/cloud-builders/docker, waitFor: ["-"], args: [build, -f, deploy/Dockerfile.service, --build-arg, SERVICE=model-gateway,         -t, "${_REPO}/model-gateway:${_TAG}", .] }
  - { id: ingestion,             name: gcr.io/cloud-builders/docker, waitFor: ["-"], args: [build, -f, deploy/Dockerfile.service, --build-arg, SERVICE=ingestion,             -t, "${_REPO}/ingestion:${_TAG}", .] }
  - { id: engine-extraction,     name: gcr.io/cloud-builders/docker, waitFor: ["-"], args: [build, -f, deploy/Dockerfile.service, --build-arg, SERVICE=engine-extraction,     -t, "${_REPO}/engine-extraction:${_TAG}", .] }
  - { id: engine-divergence,     name: gcr.io/cloud-builders/docker, waitFor: ["-"], args: [build, -f, deploy/Dockerfile.service, --build-arg, SERVICE=engine-divergence,     -t, "${_REPO}/engine-divergence:${_TAG}", .] }
  - { id: engine-questions,      name: gcr.io/cloud-builders/docker, waitFor: ["-"], args: [build, -f, deploy/Dockerfile.service, --build-arg, SERVICE=engine-questions,      -t, "${_REPO}/engine-questions:${_TAG}", .] }
  - { id: engine-recommendation, name: gcr.io/cloud-builders/docker, waitFor: ["-"], args: [build, -f, deploy/Dockerfile.service, --build-arg, SERVICE=engine-recommendation, -t, "${_REPO}/engine-recommendation:${_TAG}", .] }
  - { id: engine-resolution,     name: gcr.io/cloud-builders/docker, waitFor: ["-"], args: [build, -f, deploy/Dockerfile.service, --build-arg, SERVICE=engine-resolution,     -t, "${_REPO}/engine-resolution:${_TAG}", .] }
  - { id: engine-artefacts,      name: gcr.io/cloud-builders/docker, waitFor: ["-"], args: [build, -f, deploy/Dockerfile.service, --build-arg, SERVICE=engine-artefacts,      -t, "${_REPO}/engine-artefacts:${_TAG}", .] }
  - { id: engine-brief,          name: gcr.io/cloud-builders/docker, waitFor: ["-"], args: [build, -f, deploy/Dockerfile.service, --build-arg, SERVICE=engine-brief,          -t, "${_REPO}/engine-brief:${_TAG}", .] }
  - { id: api-gateway,           name: gcr.io/cloud-builders/docker, waitFor: ["-"], args: [build, -f, deploy/Dockerfile.gateway,                                             -t, "${_REPO}/api-gateway:${_TAG}", .] }
images:
  - "${_REPO}/ledger:${_TAG}"
  - "${_REPO}/event-bus:${_TAG}"
  - "${_REPO}/model-gateway:${_TAG}"
  - "${_REPO}/ingestion:${_TAG}"
  - "${_REPO}/engine-extraction:${_TAG}"
  - "${_REPO}/engine-divergence:${_TAG}"
  - "${_REPO}/engine-questions:${_TAG}"
  - "${_REPO}/engine-recommendation:${_TAG}"
  - "${_REPO}/engine-resolution:${_TAG}"
  - "${_REPO}/engine-artefacts:${_TAG}"
  - "${_REPO}/engine-brief:${_TAG}"
  - "${_REPO}/api-gateway:${_TAG}"
options: { machineType: E2_HIGHCPU_8 }
timeout: 1800s
