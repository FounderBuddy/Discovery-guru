# Ledger schema migrations. The ledger runs `upgrade head` itself on start, so you rarely call this by hand.
#   new migration after changing app/db.py:   cd services/ledger && alembic revision --autogenerate -m "what changed"
#   check models and migrations agree:         cd services/ledger && alembic check
# The database URL comes from LEDGER_DB_URL (same as the service), not from this file.
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
